name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build the interface embedded by the backend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ui:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --omit=dev

  compliance:
    name: Security and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
        working-directory: apps/desktop
      - name: Install audit tools
        run: cargo install --locked cargo-deny cargo-audit
      - run: cargo deny check licenses sources bans
      - run: cargo audit
      - name: Shipped licenses match the policy
        run: node scripts/licenses.mjs --check
      - name: No keys or credentials in the repository
        run: node scripts/secrets_check.mjs

  e2e:
    name: End-to-end (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx tauri build --debug --bundles nsis
      - name: Signing tool for the update test
        run: cargo build -p tronic-update --bin tronic-release
      - name: Screen size the tests assume
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ }
          if ($found) {
            Write-Output "WebView2 runtime: $found"
          } else {
            Write-Output "No WebView2 runtime here, installing it"
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
            Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent','/install' -Wait
          }
      - run: node e2e/smoke.mjs
      - run: node e2e/schematic.mjs
      - run: node e2e/recovery.mjs
      - name: Parser for the manufacturing files (development only)
        run: python -m pip install --no-deps gerbonara click
      - name: End-to-end board editor
        run: node e2e/pcb.mjs
        env:
          TRONICCAD_VERIFY_PYTHON: python
      - run: node e2e/router.mjs
      - run: node e2e/sim3d.mjs
      - run: node e2e/ai.mjs
      - run: node e2e/cloud.mjs
      - run: node e2e/team.mjs
      - run: node e2e/update.mjs
      - run: node e2e/extensions.mjs
      - run: node e2e/installer.mjs
      - name: Picture of the desktop after a failure
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force ../../e2e-artifacts | Out-Null
          $picture.Save((Join-Path (Resolve-Path ../../e2e-artifacts) 'desktop-after-failure.png'))
          Get-Process | Where-Object { $_.ProcessName -match 'troniccad|msedgewebview2' } | Select-Object ProcessName, Id, MainWindowTitle | Format-Table | Out-String | Write-Output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
